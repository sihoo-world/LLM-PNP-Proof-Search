[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-pnp-proof-search"
version = "0.1.0"
description = "Reproducible generation and counterexample testing of candidate Boolean circuit lower-bound lemmas"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2.9,<3", "PyYAML>=6.0,<7", "sympy>=1.13,<2", "z3-solver>=4.13,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
pnp-search = "pnp_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pnp_search = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

