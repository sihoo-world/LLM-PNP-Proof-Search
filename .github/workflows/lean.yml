name: Trusted Lean template
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lean-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Elan and Lean
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check core theorem project
        working-directory: lean
        run: |
          lake --version
          lake -f lakefile.core.toml build
          lake -f lakefile.core.toml env lean PNPResearch/Basic.lean
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - name: Check Python to Lean evidence boundary
        run: python -m pytest tests/test_lean.py -q
